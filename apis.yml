aid: teamshares-inc
name: Teamshares Inc
description: 'Teamshares is a tech-enabled acquirer of small businesses that offers a permanent home for
  companies whose owners are retiring. It programmatically buys profitable companies with $0.5-5 million
  of EBITDA from retiring owners, integrates them onto the Teamshares operating platform of financial products,
  software, and education, and helps employees earn company stock through employee ownership. Backed by QED
  Investors and other fintech investors, Teamshares runs a login-gated operating platform (os.teamshares.com)
  for its portfolio companies plus an investor portal. As of this profile Teamshares publishes no public
  developer API, developer portal, or API documentation.'
